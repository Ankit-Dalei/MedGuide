<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedGuide</title>
    <link rel="icon" href="./img/icon.png">
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .main_find_panal{
            /* background-color: yellowgreen; */
            height: auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .mfp_search_panal{
            /* background-color: violet; */
            width: 90%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mfpsp_input{
            /* background-color: thistle; */
            width: 80%;
            height: 70%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            border: rgb(185, 183, 183) 0.5px solid;
        }
        .mfpsp_input input{
            height: 40%;
            width: 85%;
            padding: 10px;
            outline: none;
            border: 0;
            font-size: 1rem;
            border-radius: 20px;
        }
        .mfpsp_input:hover{
            border: rgb(114, 133, 138) 0.5px solid;
        }
        .mfpsp_input button{
            height: 63%;
            font-size: 1rem;
            border: 0;
            width: 10%;
            border-radius: 20px;
        }
        .mfp_display_panal{
            /* background-color: turquoise; */
            width: 95%;
            height: auto;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;
        }
        .mfpdp_card{
            background-color: rgb(244, 242, 244);
            height: 230px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            box-shadow: 0px 0px 8px rgba(187, 183, 183, 0.792);
        }
        .mfpdp_c_left{
            /* background-color: aqua; */
            height: 90%;
            width: 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 3px;
            position: relative;
        }
        .mfcl_name{
            /* background-color: thistle; */
            height: auto;
            width: 98%;
            font-size: 2rem;
            position: absolute;
            overflow: hidden;
            top: 0;
        }
        .mfcl_mil{
            /* background-color: tomato; */
            height: auto;
            width: 100%;
            font-size: 1rem;
            position: absolute;
            top: 50px;
        }
        .mfpdp_c_left button{
            background-color: rgb(93, 92, 98);
            height: 50px;
            width: 99%;
            font-size: 2rem;
            outline: none;
            border: 0;
            color: beige;
            position: absolute;
            bottom: 0;
            cursor: pointer;
        }
        .mfpdp_c_left button a{
            text-decoration: none;
            color: beige;
        }
        .mfpdp_c_right{
            background-color: rgb(56, 61, 61);
            height: 90%;
            width: 35%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mfpdp_c_right img{
            width: 100%;
            filter: brightness(1.9);
        }
    </style>
</head>
<body>
    <main>
        <div class="main_find_panal">
            <div class="mfp_search_panal">
                <form class="mfpsp_input">
                    <input type="text" placeholder="Search your disease here" id="inpu">
                    <button id="btn">Search</button>
                </form>
            </div>
            <div class="mfp_display_panal" id="mfp_display_panal">
                <!-- <div class="mfpdp_card">
                    <div class="mfpdp_c_left">
                        <div class="mfcl_name">
                            Adriline mirriot
                        </div>
                        <div class="mfcl_mil">
                            20Milligram
                        </div>
                        <button>More Info</button>
                    </div>
                    <div class="mfpdp_c_right">
                        <img src="./img/icon.png" alt="">
                    </div>
                </div> -->
                <!-- <div class="mfpdp_card">
                    <div class="mfpdp_c_left">
                        <div class="mfcl_name">
                            Adriline mirriot
                        </div>
                        <div class="mfcl_mil">
                            20Milligram
                        </div>
                        <button>More Info</button>
                    </div>
                    <div class="mfpdp_c_right">
                        <img src="./img/icon.png" alt="">
                    </div>
                </div> -->
            </div>
        </div>
    </main>
    <script>
        let bu=document.getElementById("btn")
        let inpu=document.getElementById("inpu")
        let mfp_display_panal=document.getElementById("mfp_display_panal")
        let updation=""
        let val
        bu.addEventListener("click",async (e)=>{
            e.preventDefault();
        //    if (updation!="") {
            
        //    } else {
            val=inpu.value
            const response = await fetch(`https://api.fda.gov/drug/event.json?search=patient.reaction.reactionmeddrapt:%22${val}%22&limit=1`);
            const medi = await response.json();
            // console.log(response)
            console.log(medi)
            let drugs=medi.results[0].patient.drug
            // console.log(drugs);
            updation=" "
            mfp_display_panal.innerHTML=updation
            for (let i = 0; i < drugs.length; i++) {
                // console.log(drugs[i].openfda.manufacturer_name[0])   
                updation+=`<div class="mfpdp_card">
                    <div class="mfpdp_c_left">
                        <div class="mfcl_name">
                            ${drugs[i].medicinalproduct}
                        </div>
                        <div class="mfcl_mil">
                            ${drugs[i].drugdosagetext}
                        </div>
                        <button><a href="https://www.google.com/search?q=${drugs[i].medicinalproduct}&rlz=1C1RXQR_enIN1091IN1091&oq=ADVAIR+HFA&gs_lcrp=EgZjaHJvbWUyCQgAEEUYORiABDIGCAEQRRg7MgYIAhBFGDsyBggDEEUYOzIGCAQQIxgnMgcIBRAAGIAEMgcIBhAAGIAEMgcIBxAAGIAEMgcICBAAGIAEMgcICRAAGIAE0gEHODkyajBqN6gCALACAA&sourceid=chrome&ie=UTF-8" target="1">More Info</a></button>
                    </div>
                    <div class="mfpdp_c_right">
                        <img src="./img/icon.png" alt="">
                    </div>
                </div>` 
            }
            mfp_display_panal.innerHTML=updation
            inpu.value=""
            updation=""
        //    }
        })

    </script>
</body>
</html>
